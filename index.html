<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cam" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <title>Ai Cam</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <main class="stage" id="stage">
      <div class="robot-wrap" id="robotWrap">
        <div class="robot-glow"></div>
        <svg class="looi-face" id="looiFace" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
          <g id="leftEyeG">
            <ellipse class="eye" cx="95" cy="100" rx="58" ry="48" />
            <ellipse class="pupil" id="leftPupil" cx="95" cy="105" rx="18" ry="20" />
            <circle class="shine" cx="82" cy="90" r="8" />
          </g>
          <g id="rightEyeG">
            <ellipse class="eye" cx="225" cy="100" rx="58" ry="48" />
            <ellipse class="pupil" id="rightPupil" cx="225" cy="105" rx="18" ry="20" />
            <circle class="shine" cx="212" cy="90" r="8" />
          </g>
        </svg>
        <div class="listening-ring" id="listeningRing"></div>
        <p class="robot-status fade" id="robotStatus"></p>
      </div>

      <div id="camLayer" class="cam-layer hidden">
        <video id="camVideo" playsinline autoplay muted></video>
        <canvas id="camCanvas" class="hidden"></canvas>
        <div class="cam-hud">
          <div class="hud-top">
            <span id="orientBadge" class="badge">Портрет</span>
            <span id="modeBadge" class="badge">Авто</span>
            <span id="recBadge" class="badge rec hidden">● REC</span>
          </div>
          <div class="hud-bottom">
            <button class="hud-btn" id="btnFlipCam" title="Камера">🔄</button>
            <button class="hud-shutter" id="btnShutter" title="Снимок"></button>
            <button class="hud-btn" id="btnCamClose" title="Закрыть">✕</button>
          </div>
        </div>
      </div>
    </main>

    <div id="miniRobot" class="mini-robot hidden" aria-hidden="true">
      <svg viewBox="0 0 120 70" class="mini-face">
        <ellipse class="m-eye" cx="35" cy="35" rx="22" ry="18" />
        <ellipse class="m-eye" cx="85" cy="35" rx="22" ry="18" />
        <circle class="m-pupil" cx="35" cy="38" r="7" />
        <circle class="m-pupil" cx="85" cy="38" r="7" />
      </svg>
    </div>

    <div class="edge-right" id="edgeRight" aria-hidden="true"></div>
    <div class="edge-bottom" id="edgeBottom" aria-hidden="true"></div>
    <button type="button" class="menu-nub" id="menuNub" aria-label="Меню"></button>

    <div class="scrim" id="scrim"></div>

    <section class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-title">Cam</span>
        <div class="header-actions">
          <button id="btnCall" class="icon-btn" aria-label="Звонок">📞</button>
          <button id="btnMute" class="icon-btn" aria-label="Звук">🔊</button>
          <button id="btnOrient" class="icon-btn" aria-label="Ориентация">🔄</button>
          <button type="button" class="panel-close" id="panelClose" aria-label="Закрыть">✕</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="home">Cam</button>
        <button class="tab" data-tab="stick">Палка</button>
        <button class="tab" data-tab="shoot">Съёмка</button>
        <button class="tab" data-tab="director">Director</button>
        <button class="tab" data-tab="apps">Apps</button>
      </div>

      <div class="pane active" id="pane-home">
        <p class="lead">Питомец как LOOI. Свайп справа — меню. Тап по глазам.</p>
        <div class="row">
          <button class="btn primary" id="btnWake">Разбудить</button>
          <button class="btn" id="btnIdle">Живёт сам</button>
        </div>
        <div class="row">
          <button class="btn" id="btnCallPanel">📞 Cam звонит</button>
        </div>
        <div class="idle-log" id="idleLog"></div>
      </div>

      <div class="pane" id="pane-stick">
        <p class="lead">OM5 — тело Cam</p>
        <p class="hint" id="bleStatus">Bluetooth: …</p>
        <div class="row">
          <button class="btn primary" id="btnBleConnect">Подключить BLE</button>
          <button class="btn" id="btnOpenMimo">Mimo</button>
        </div>
        <div class="row wrap">
          <button class="chip cmd" data-cmd="left">←</button>
          <button class="chip cmd" data-cmd="right">→</button>
          <button class="chip cmd" data-cmd="up">↑</button>
          <button class="chip cmd" data-cmd="down">↓</button>
          <button class="chip cmd" data-cmd="orbit">Орбита</button>
          <button class="chip cmd" data-cmd="push">Наезд</button>
          <button class="chip cmd" data-cmd="stop">Стоп</button>
          <button class="chip cmd" data-cmd="track">Track</button>
        </div>
        <p class="hint">Закрой Mimo перед BLE. На iPhone лучше ios-bridge / beacio.</p>
        <div class="tip-card" id="stickCard">
          <p class="tip-title">Тело</p>
          <p class="tip-text">Команда уходит на палку, если BLE на связи.</p>
        </div>
      </div>

      <div class="pane" id="pane-shoot">
        <div class="row wrap">
          <button class="chip" data-timer="0">off</button>
          <button class="chip active" data-timer="3">3с</button>
          <button class="chip" data-timer="5">5с</button>
          <button class="chip" data-timer="10">10с</button>
        </div>
        <div class="row">
          <button class="btn primary" id="btnOpenCam">Камера</button>
          <button class="btn" id="btnManual">Ручной: выкл</button>
        </div>
        <div class="row">
          <button class="btn" id="btnPhotoMode">📷 Фото</button>
          <button class="btn" id="btnVideoMode">🎥 Видео</button>
        </div>
        <div id="snapBox" class="snap-box hidden"></div>
      </div>

      <div class="pane" id="pane-director">
        <div class="row wrap">
          <button class="chip dir" data-dir="portrait">Портрет</button>
          <button class="chip dir" data-dir="cinematic">Кино</button>
          <button class="chip dir" data-dir="blog">Блог</button>
          <button class="chip dir" data-dir="product">Предмет</button>
          <button class="chip dir" data-dir="landscape">Пейзаж</button>
          <button class="chip dir" data-dir="sport">Спорт</button>
        </div>
        <div class="tip-card" id="tipCard">
          <p class="tip-title">Режим</p>
          <p class="tip-text">Выбери — Cam подскажет кадр.</p>
        </div>
        <button class="btn primary" id="btnNextTip">Дальше</button>
      </div>

      <div class="pane" id="pane-apps">
        <div class="app-grid">
          <button class="app-card" data-app="camera">📷 Камера</button>
          <button class="app-card" data-app="mimo">🎛 Mimo</button>
          <button class="app-card" data-app="photos">🖼 Фото</button>
          <button class="app-card" data-app="phone">📞 Телефон</button>
        </div>
        <div class="row">
          <input id="callNumber" class="call-input" type="tel" placeholder="Номер" inputmode="tel" />
          <button class="btn primary" id="btnDial">Позвонить</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
  <script src="ui-panel.js"></script>
  <script src="app.js"></script>
  <script src="ble/protocol.js"></script>
  <script src="stick.js"></script>
</body>
</html>
